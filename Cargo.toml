[package]
name = "jsfs"
version = "4.16.0"
description = "JSFS: Journal Scraper For Students (Pure Rust Native Edition)"
authors = ["JSFS Contributors"]
edition = "2021"

[[bin]]
name = "jsfs"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = "0.37.0"
egui_extras = "0.37.0"
rfd = "0.18.0"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream", "json", "cookies", "hickory-dns"] }
scraper = "0.21"
regex = "1"
once_cell = "1"
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.75"
zip = "2"
quick-xml = "0.37"
pdf-extract = "0.7"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
