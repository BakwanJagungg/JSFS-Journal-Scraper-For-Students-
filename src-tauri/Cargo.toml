[package]
name = "jsfs"
version = "3.0.1"
description = "JSFS — Journal Scraper For Students"
authors = ["JSFS Contributors"]
edition = "2021"

[lib]
name = "jsfs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream", "json", "cookies", "hickory-dns"] }
scraper = "0.21"
regex = "1"
once_cell = "1"
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.75"
zip = "2"
quick-xml = "0.37"
pdf-extract = "0.7"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
