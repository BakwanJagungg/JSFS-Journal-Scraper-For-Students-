name: Release Windows Binary (JSFS v4)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.lock sync
        run: cargo check --locked

      - name: Run unit tests
        run: cargo test --locked

      - name: Run Clippy lints
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --target i686-pc-windows-msvc -- -D warnings

      - name: Build Pure Rust 64-Bit Release Binary
        run: cargo build --release --locked

      - name: Build Pure Rust 32-Bit Release Binary
        run: cargo build --release --locked --target i686-pc-windows-msvc

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $matches[1] } else { 'v4.14.1' }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $isccExe = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $isccExe)) { throw "Inno Setup compiler (iscc.exe) not found." }
          & $isccExe "/DMyAppVersion=$tag" installer\jsfs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Portable Windows ZIP & SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-pkg-x64 -Force | Out-Null
          Copy-Item target\release\jsfs.exe release-pkg-x64\jsfs.exe -Force
          Copy-Item README.md release-pkg-x64\README.md -Force
          Copy-Item LICENSE release-pkg-x64\LICENSE -Force
          $zipX64 = "JSFS-windows-x64-portable.zip"
          Compress-Archive -Path release-pkg-x64\jsfs.exe, release-pkg-x64\README.md, release-pkg-x64\LICENSE -DestinationPath $zipX64 -Force

          New-Item -ItemType Directory -Path release-pkg-x86 -Force | Out-Null
          Copy-Item target\i686-pc-windows-msvc\release\jsfs.exe release-pkg-x86\jsfs.exe -Force
          Copy-Item README.md release-pkg-x86\README.md -Force
          Copy-Item LICENSE release-pkg-x86\LICENSE -Force
          $readme32 = @(
            'JSFS - Journal Scraper For Students (Windows 32-bit / x86 Edition)'
            ''
            'Paket portabel ini dikompilasi khusus untuk arsitektur Windows 10/11 32-bit (i686-pc-windows-msvc).'
            'Dapat dijalankan langsung di Windows 32-bit maupun Windows 64-bit (via subsistem WOW64) tanpa instalasi.'
            ''
            'Cara pakai:'
            '1. Ekstrak seluruh isi file zip ini ke folder mana saja di komputer Anda.'
            '2. Jalankan jsfs.exe.'
            '3. Seluruh hasil ekspor akan otomatis disimpan pada folder output\ di samping file jsfs.exe.'
          ) -join "`r`n"
          $readme32 | Set-Content -Path release-pkg-x86\README-32bit.txt -Encoding UTF8

          $zipX86 = "JSFS-windows-x86-portable.zip"
          Compress-Archive -Path release-pkg-x86\jsfs.exe, release-pkg-x86\README.md, release-pkg-x86\LICENSE, release-pkg-x86\README-32bit.txt -DestinationPath $zipX86 -Force

          $setupHash = (Get-FileHash JSFS-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipX64Hash = (Get-FileHash $zipX64 -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipX86Hash = (Get-FileHash $zipX86 -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash target\release\jsfs.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setupHash  JSFS-windows-x64-setup.exe"
            "$zipX64Hash  $zipX64"
            "$zipX86Hash  $zipX86"
            "$exeHash  jsfs.exe"
          ) | Set-Content -Path SHA256SUMS.txt -Encoding UTF8

      - name: Upload Installer, Portable ZIP, EXE & Checksums to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            JSFS-windows-x64-setup.exe
            JSFS-windows-x64-portable.zip
            JSFS-windows-x86-portable.zip
            target/release/jsfs.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
