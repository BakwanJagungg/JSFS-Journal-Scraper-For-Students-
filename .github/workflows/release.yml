name: Dual-Track Release Binaries (JSFS Standard & JSFS+ Workstation)

on:
  push:
    tags:
      - 'v*'
      - 'plus-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy lints & unit tests (Dual-Track)
        shell: pwsh
        run: |
          $isPlus = $env:GITHUB_REF_NAME -like 'plus-v*'
          if ($isPlus) {
            cargo clippy --all-targets --locked --features plus -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --features plus
          } else {
            cargo clippy --all-targets --locked --no-default-features -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --all-targets --locked --no-default-features --target i686-pc-windows-msvc -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --no-default-features
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Release Binaries & Installer
        shell: pwsh
        run: |
          $isPlus = $env:GITHUB_REF_NAME -like 'plus-v*'
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $isccExe = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $isccExe)) { throw "Inno Setup compiler (iscc.exe) not found." }

          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null

          if ($isPlus) {
            $ver = if ($env:GITHUB_REF_NAME -match '^plus-v(.+)$') { $matches[1] } else { '5.0.0' }
            cargo build --release --locked --bin jsfs-plus --features plus
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $isccExe "/DMyAppVersion=$ver" installer\jsfs-plus.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Copy-Item JSFS-Plus-windows-x64-setup.exe release-artifacts\JSFS-Plus-windows-x64-setup.exe -Force
            Copy-Item target\release\jsfs-plus.exe release-artifacts\jsfs-plus.exe -Force
            New-Item -ItemType Directory -Path release-pkg-plus -Force | Out-Null
            Copy-Item target\release\jsfs-plus.exe release-pkg-plus\jsfs-plus.exe -Force
            Copy-Item README.md release-pkg-plus\README.md -Force
            Copy-Item LICENSE release-pkg-plus\LICENSE -Force
            Compress-Archive -Path release-pkg-plus\jsfs-plus.exe, release-pkg-plus\README.md, release-pkg-plus\LICENSE -DestinationPath release-artifacts\JSFS-Plus-windows-x64-portable.zip -Force
          } else {
            $ver = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $matches[1] } else { '4.16.2' }
            cargo build --release --locked --no-default-features --bin jsfs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo build --release --locked --no-default-features --bin jsfs --target i686-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $isccExe "/DMyAppVersion=$ver" installer\jsfs.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Copy-Item JSFS-windows-x64-setup.exe release-artifacts\JSFS-windows-x64-setup.exe -Force
            Copy-Item target\release\jsfs.exe release-artifacts\jsfs.exe -Force
            New-Item -ItemType Directory -Path release-pkg-x64 -Force | Out-Null
            Copy-Item target\release\jsfs.exe release-pkg-x64\jsfs.exe -Force
            Copy-Item README.md release-pkg-x64\README.md -Force
            Copy-Item LICENSE release-pkg-x64\LICENSE -Force
            Compress-Archive -Path release-pkg-x64\jsfs.exe, release-pkg-x64\README.md, release-pkg-x64\LICENSE -DestinationPath release-artifacts\JSFS-windows-x64-portable.zip -Force

            New-Item -ItemType Directory -Path release-pkg-x86 -Force | Out-Null
            Copy-Item target\i686-pc-windows-msvc\release\jsfs.exe release-pkg-x86\jsfs.exe -Force
            Copy-Item README.md release-pkg-x86\README.md -Force
            Copy-Item LICENSE release-pkg-x86\LICENSE -Force
            Compress-Archive -Path release-pkg-x86\jsfs.exe, release-pkg-x86\README.md, release-pkg-x86\LICENSE -DestinationPath release-artifacts\JSFS-windows-x86-portable.zip -Force
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts/*
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install minimal Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build & Package Linux Release (Dual-Track)
        run: |
          mkdir -p release-pkg-linux release-artifacts
          if [[ "${GITHUB_REF_NAME}" == plus-v* ]]; then
            cargo clippy --all-targets --locked --features plus -- -D warnings
            cargo test --locked --features plus
            cargo build --release --locked --bin jsfs-plus --features plus
            cp target/release/jsfs-plus release-pkg-linux/jsfs-plus
            chmod +x release-pkg-linux/jsfs-plus
            cp README.md release-pkg-linux/README.md
            cp LICENSE release-pkg-linux/LICENSE
            tar -czf release-artifacts/JSFS-Plus-linux-x64.tar.gz -C release-pkg-linux jsfs-plus README.md LICENSE
          else
            cargo clippy --all-targets --locked --no-default-features -- -D warnings
            cargo test --locked --no-default-features
            cargo build --release --locked --no-default-features --bin jsfs
            cp target/release/jsfs release-pkg-linux/jsfs
            chmod +x release-pkg-linux/jsfs
            cp README.md release-pkg-linux/README.md
            cp LICENSE release-pkg-linux/LICENSE
            tar -czf release-artifacts/JSFS-linux-x64.tar.gz -C release-pkg-linux jsfs README.md LICENSE
          fi

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: release-artifacts/*.tar.gz
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (Apple Silicon & Intel Preview)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build & Package macOS Release Archives (Dual-Track)
        run: |
          mkdir -p release-pkg-macos-arm64 release-pkg-macos-x64 release-artifacts
          if [[ "${GITHUB_REF_NAME}" == plus-v* ]]; then
            cargo clippy --all-targets --locked --features plus --target aarch64-apple-darwin -- -D warnings
            cargo clippy --all-targets --locked --features plus --target x86_64-apple-darwin -- -D warnings
            cargo test --locked --features plus --target aarch64-apple-darwin
            cargo build --release --locked --bin jsfs-plus --features plus --target aarch64-apple-darwin
            cargo build --release --locked --bin jsfs-plus --features plus --target x86_64-apple-darwin

            cp target/aarch64-apple-darwin/release/jsfs-plus release-pkg-macos-arm64/jsfs-plus
            chmod +x release-pkg-macos-arm64/jsfs-plus
            cp README.md release-pkg-macos-arm64/README.md
            cp LICENSE release-pkg-macos-arm64/LICENSE
            tar -czf release-artifacts/JSFS-Plus-macos-arm64-preview.tar.gz -C release-pkg-macos-arm64 jsfs-plus README.md LICENSE

            cp target/x86_64-apple-darwin/release/jsfs-plus release-pkg-macos-x64/jsfs-plus
            chmod +x release-pkg-macos-x64/jsfs-plus
            cp README.md release-pkg-macos-x64/README.md
            cp LICENSE release-pkg-macos-x64/LICENSE
            tar -czf release-artifacts/JSFS-Plus-macos-x64-preview.tar.gz -C release-pkg-macos-x64 jsfs-plus README.md LICENSE
          else
            cargo clippy --all-targets --locked --no-default-features --target aarch64-apple-darwin -- -D warnings
            cargo clippy --all-targets --locked --no-default-features --target x86_64-apple-darwin -- -D warnings
            cargo test --locked --no-default-features --target aarch64-apple-darwin
            cargo build --release --locked --no-default-features --bin jsfs --target aarch64-apple-darwin
            cargo build --release --locked --no-default-features --bin jsfs --target x86_64-apple-darwin

            cp target/aarch64-apple-darwin/release/jsfs release-pkg-macos-arm64/jsfs
            chmod +x release-pkg-macos-arm64/jsfs
            cp README.md release-pkg-macos-arm64/README.md
            cp LICENSE release-pkg-macos-arm64/LICENSE
            tar -czf release-artifacts/JSFS-macos-arm64-preview.tar.gz -C release-pkg-macos-arm64 jsfs README.md LICENSE

            cp target/x86_64-apple-darwin/release/jsfs release-pkg-macos-x64/jsfs
            chmod +x release-pkg-macos-x64/jsfs
            cp README.md release-pkg-macos-x64/README.md
            cp LICENSE release-pkg-macos-x64/LICENSE
            tar -czf release-artifacts/JSFS-macos-x64-preview.tar.gz -C release-pkg-macos-x64 jsfs README.md LICENSE
          fi

      - name: Upload macOS preview release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: release-artifacts/*.tar.gz
          retention-days: 7

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/plus-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt

      - name: Upload Multi-Track Release & Unified Checksums
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
