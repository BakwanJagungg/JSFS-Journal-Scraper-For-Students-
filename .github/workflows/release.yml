name: Release Windows Binary (JSFS v4)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Run Clippy lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build Pure Rust Release Binary
        run: cargo build --release --locked

      - name: Package Portable Windows Release
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'v4.0.2' }
          New-Item -ItemType Directory -Path release-pkg -Force | Out-Null
          Copy-Item target\release\jsfs.exe release-pkg\jsfs.exe -Force
          Copy-Item LICENSE release-pkg\LICENSE -Force
          $zipName = "JSFS-$tag-windows-x64-portable.zip"
          Compress-Archive -Path release-pkg\jsfs.exe, release-pkg\LICENSE -DestinationPath $zipName -Force
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Portable EXE & ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/jsfs.exe
            ${{ env.ZIP_NAME }}
          generate_release_notes: true
